guest_vms:
  - instance_id: fedora-vm1
    local_hostname: fedora-vm1
    noautoconsole: true
    image_filename: Fedora-Cloud-Base-36-1.5.x86_64.raw.xz
    memory: '8192'
    vcpus: '2'
    image_format: raw
    disk_size: 30G
    os_variant: fedora-unknown
    user_name: kvm-user
    network:
