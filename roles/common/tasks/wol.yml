- name: Template WOL service definition
  template:
    src: wol.service.j2
    dest: /etc/systemd/system/wol.service

- name: Enable WOL service
  systemd:
    name: wol
    daemon_reload: yes
    enabled: yes
  register: wol_service

- name: Reboot if Service is enabled at first time
  reboot:
    reboot_timeout: 100
  when: wol_service.changed
