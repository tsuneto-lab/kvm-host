- name: check the pool
  become: true
  become_user: '{{ kvm_user }}'
  shell: |
    virsh pool-dumpxml --pool {{ virt_pool_name }} | grep '<path>/var/lib/libvirt/images</path>'
    virsh pool-list | grep '{{ virt_pool_name }}' | grep active | grep yes
