- name: Mount disk to default image directory
  ansible.posix.mount:
    path: /var/lib/libvirt/images
    src: '{{ kvm_image_volume_device }}'
    fstype: ext4
    state: mounted
  when: kvm_image_volume_device is defined

- name: modify pool dir
  file:
    path: /var/lib/libvirt/images
    mode: '775'
    owner: 'libvirt-qemu'
    group: 'kvm'

- name: create isos dir
  file:
    path: '{{ item }}'
    mode: '775'
    group: 'kvm'
    state: directory
  loop:
    - /var/lib/libvirt/images/isos/fedora
    - /var/lib/libvirt/images/isos/cloud-init

