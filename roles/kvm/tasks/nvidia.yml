- name: Update PCI IDs
  command: update-pciids

- name: Install Nvidia drivers
  ansible.builtin.apt:
    name:
      - '{{ nvidia_driver }}'
    state: present
    update_cache: yes
  register: driver
  when: nvidia_driver is defined

- name: Reboot if driver is changed
  ansible.builtin.reboot:
    reboot_timeout: 100
  when: driver.changed
