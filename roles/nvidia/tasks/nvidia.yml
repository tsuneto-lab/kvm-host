- name: Update PCI IDs
  command: update-pciids

- name: Install Nvidia drivers
  ansible.builtin.apt:
    name:
      - '{{ item }}'
    state: present
    update_cache: true
  register: driver
  loop:
    - '{{ nvidia_driver }}'
  ignore_errors: true

- name: Set default to Multi User
  file:
    src: /usr/lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link

- name: Reboot if driver is changed
  ansible.builtin.reboot:
    reboot_timeout: 100
  when: driver.changed
